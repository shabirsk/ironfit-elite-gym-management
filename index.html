<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IronFit Elite — Premium luxury fitness training. Transform your body with world-class trainers and cutting-edge programs." />
    <meta name="keywords" content="luxury fitness, premium gym, personal training, strength training, elite coaching" />
    <meta name="theme-color" content="#050505" />
    <title>IronFit Elite | Premium Luxury Fitness</title>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://images.pexels.com" />

    <!-- Preload critical assets -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" />
    <link rel="preload" as="image" href="https://images.pexels.com/photos/841130/pexels-photo-841130.jpeg?auto=compress&cs=tinysrgb&w=1920&q=80" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
      <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <style>
      html, body { margin: 0; padding: 0; background: #050505; color: #fff; font-family: 'Inter', sans-serif; }
      #root { min-height: 100vh; }
      .font-cinematic { font-family: 'Oswald', sans-serif; }
      .hero-skeleton { position: fixed; inset: 0; z-index: 999; background: #050505; display: flex; flex-direction: column; }
      .hero-skeleton-bg { position: absolute; inset: 0; background: url(https://images.pexels.com/photos/841130/pexels-photo-841130.jpeg?auto=compress&cs=tinysrgb&w=1920&q=80) center/cover no-repeat; opacity: 0.6; }
      .hero-skeleton-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(5,5,5,0.7), rgba(5,5,5,0.5), rgba(5,5,5,0.95)); }
      .hero-skeleton-content { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 128px 24px 96px; max-width: 1280px; margin: 0 auto; width: 100%; }
      .hero-skeleton-label { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
      .hero-skeleton-line { width: 48px; height: 2px; background: #FFC107; }
      .hero-skeleton-text { color: #FFC107; font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 700; }
      .hero-skeleton-title { font-family: 'Oswald', sans-serif; font-size: clamp(48px, 10vw, 120px); line-height: 0.9; font-weight: 700; text-transform: uppercase; letter-spacing: -0.02em; margin-bottom: 32px; }
      .hero-skeleton-title .gold { color: #FFC107; }
      .hero-skeleton-title .outline { color: transparent; -webkit-text-stroke: 2px #fff; }
      .hero-skeleton-subtitle { font-size: clamp(16px, 2vw, 24px); color: rgba(255,255,255,0.7); max-width: 560px; margin-bottom: 48px; line-height: 1.6; }
      @media (min-width: 768px) { .hero-skeleton-hide { opacity: 1; transition: opacity 0.5s ease; } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant hero skeleton — shows before React loads, then React replaces it -->
      <div class="hero-skeleton" id="hero-skeleton">
        <div class="hero-skeleton-bg"></div>
        <div class="hero-skeleton-overlay"></div>
        <div class="hero-skeleton-content">
          <div class="hero-skeleton-label">
            <div class="hero-skeleton-line"></div>
            <span class="hero-skeleton-text">Premium Fitness Experience</span>
          </div>
          <div class="hero-skeleton-title">
            <div>DOMINATE</div>
            <div class="outline">YOUR</div>
            <div class="gold">LIMITS</div>
          </div>
          <div class="hero-skeleton-subtitle">Transform your body with world-class coaching, elite trainers, and cutting-edge fitness programs.</div>
          <div style="display:flex;flex-wrap:wrap;gap:24px">
            <a href="/member/register" style="display:inline-flex;align-items:center;gap:8px;padding:16px 32px;background:#FFC107;color:#050505;font-weight:700;font-size:18px;border-radius:0;text-decoration:none">Join The Elite</a>
            <button style="display:inline-flex;align-items:center;gap:16px;padding:16px 32px;color:#fff;font-size:16px;font-weight:500;background:none;border:none;cursor:pointer">
              <span style="width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center">
                <span style="width:0;height:0;border-top:6px solid transparent;border-left:10px solid currentColor;border-bottom:6px solid transparent;margin-left:2px"></span>
              </span>
              Watch The Film
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- React replaces the skeleton when it renders -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
